name: premium_store
description: A premium minimal clothing store application.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.2.7
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.3
  firebase_auth: ^5.3.1
  http: ^1.2.2
  image_picker: ^1.1.2
  image_picker_web: ^4.0.0   # <-- رفع النسخة
  google_fonts: ^6.0.0
  qr_flutter: ^4.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true