name: premium_store
description: A premium minimal clothing store application.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^17.1.0
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  firebase_auth: ^6.1.4
  http: ^1.2.2
  image_picker: ^1.1.2
  image_picker_web: ^4.0.0   # <-- رفع النسخة
  google_fonts: ^8.0.2
  qr_flutter: ^4.0.0
  shared_preferences: ^2.5.4
  fl_chart: ^1.1.1
  audioplayers: ^6.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true